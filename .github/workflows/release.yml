name: CineStream Auto Build & Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags matching v*, e.g., v1.0.0

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk CineStream-Android.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-Android-APK
          path: CineStream-Android.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows App
        run: flutter build windows --release

      - name: Compress Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath CineStream-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-Windows-ZIP
          path: CineStream-Windows.zip

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup CocoaPods
        uses: maxim-lobanov/setup-cocoapods@v1
        with:
          version: 1.16.2

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Application (No Codesign)
        run: flutter build ipa --release --no-codesign
        continue-on-error: true

      - name: Package into unsigned IPA
        run: |
          ARCHIVE_PATH=$(find build/ios/archive -name "*.xcarchive" | head -1)
          if [ -n "$ARCHIVE_PATH" ]; then
            echo "Found archive: $ARCHIVE_PATH"
            mkdir -p Payload
            cp -r "$ARCHIVE_PATH/Products/Applications/Runner.app" Payload/
            zip -r CineStream-iOS.ipa Payload
          else
            echo "No archive found"
            exit 1
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-iOS-IPA
          path: CineStream-iOS.ipa

  release:
    needs: [build-android, build-windows, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: CineStream-Android-APK
          path: release-artifacts

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: CineStream-Windows-ZIP
          path: release-artifacts

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: CineStream-iOS-IPA
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/CineStream-Android.apk
            release-artifacts/CineStream-Windows.zip
            release-artifacts/CineStream-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
